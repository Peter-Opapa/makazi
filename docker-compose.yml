services:
  postgres:
    image: postgres:16-alpine
    container_name: makazi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: makazi
      POSTGRES_PASSWORD: makazi
      POSTGRES_DB: makazi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makazi"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: makazi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    external: true
    name: fe7a63f07feee29d8e1baf4733a79a699a7239072bac910daf1b725a9273af16
  minio_data:
    external: true
    name: 3379cf433413294b066b3a9e00f5e05de3e37f5e1fd511b8f0f733b90ff78694
